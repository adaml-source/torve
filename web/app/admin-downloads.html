  <style>
    body { margin: 0; background: var(--t-bg); color: var(--t-text); font-family: Inter, system-ui, sans-serif; }
    .wrap { max-width: 1220px; margin: 0 auto; padding: 28px 18px 64px; }

    h1 { color: #fff; font-size: 22px; margin: 0; }

    a { color: var(--t-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .auth { max-width: 400px; margin: 80px auto; text-align: center; }

<body class="modern-page admin-page">
<header class="site-header" data-site-header>
    <div class="site-header-inner">
      <a class="site-brand" href="/" aria-label="Torve home"><img src="/assets/torve-logo-transparent.png" alt="Torve" class="site-header-logo" /></a>
      <nav id="site-navigation" class="site-header-nav" aria-label="Main navigation"><a href="/#explore">Explore</a><a href="/download.html">Downloads</a><a href="/app/help.html">Guide</a><a href="/support.html">Support</a></nav>
      <div class="site-header-actions"><a class="site-account-link t-btn t-btn-secondary" href="/signin.html">Sign in</a><a class="t-btn t-btn-primary" href="/download.html"><span class="install-label-full">Install Torve</span><span class="install-label-short">Install</span><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg></a></div>
      <button class="site-menu-toggle" type="button" aria-label="Open menu" aria-controls="site-navigation" aria-expanded="false"><span></span><span></span></button>
    </div>
  </header>
  <main class="wrap">
    <div class="head">
      <h1>Release Files</h1>
      <div class="links">
        <a href="/app/admin.html">Admin home</a>
        <a href="/download.html">Download page</a>
        <a href="/downloads/releases.json">Manifest</a>
        <a href="https://api.torve.app/releases/appcast.xml">Appcast</a>
      </div>
    </div>

    <section id="authGate" class="auth">
      <h2>Admin Access</h2>
      <p>Enter the admin secret.</p>
      <input type="password" id="secretInput" placeholder="Admin secret" autocomplete="off" />
      <div style="margin-top:12px"><button class="primary" id="authBtn">Sign in</button></div>
      <div id="authMsg" class="msg err"></div>
    </section>

    <section id="adminPanel" style="display:none">
      <div class="card">
        <h2>Status</h2>
        <div id="statusGrid" class="status-grid"></div>
        <div id="globalMsg" class="msg"></div>
      </div>

      <div class="grid">
        <form class="card upload-form" data-artifact="windows">
          <h2>Windows Desktop</h2>
          <div class="field"><label>Version</label><input name="version" placeholder="1.1.0" required /></div>
          <div class="field"><label>Build label</label><input name="build_label" data-build-label required /></div>
          <div class="field"><label>MSI file</label><input name="file" type="file" accept=".msi" required /></div>
          <label class="check"><input type="checkbox" name="update_manifest" checked /> Set as current public download</label>
          <label class="check"><input type="checkbox" name="register_desktop" checked /> Register desktop updater appcast</label>
          <div class="field"><label>Release notes HTML</label><textarea name="release_notes_html"></textarea></div>
          <button class="primary" type="submit">Upload MSI</button>
          <div class="progress"><span></span></div>
          <div class="msg"></div>
        </form>

        <form class="card upload-form" data-artifact="fire_tv">
          <h2>Amazon Fire TV</h2>
          <div class="field"><label>Version</label><input name="version" placeholder="1.1.0" required /></div>
          <div class="field"><label>Build label</label><input name="build_label" data-build-label required /></div>
          <div class="field"><label>APK file</label><input name="file" type="file" accept=".apk" required /></div>
          <label class="check"><input type="checkbox" name="update_manifest" checked /> Set as current Fire TV download</label>
          <button class="primary" type="submit">Upload APK</button>
          <div class="progress"><span></span></div>
          <div class="msg"></div>
        </form>

        <form class="card upload-form" data-artifact="android_mobile">
          <h2>Android Mobile Direct</h2>
          <div class="field"><label>Version</label><input name="version" placeholder="1.1.0" required /></div>
          <div class="field"><label>Build label</label><input name="build_label" data-build-label required /></div>
          <div class="field"><label>APK file</label><input name="file" type="file" accept=".apk" required /></div>
          <label class="check"><input type="checkbox" name="update_manifest" checked /> Set as current direct mobile download</label>
          <button class="primary" type="submit">Upload APK</button>
          <div class="progress"><span></span></div>
          <div class="msg"></div>
        </form>
      </div>

      <div class="card">
        <h2>Current Manifest</h2>
        <div id="manifestTable" class="table-wrap"></div>
      </div>

      <div class="card">
        <h2>Stored Files</h2>
        <div id="filesTable" class="table-wrap"></div>
      </div>

      <div class="card">
        <h2>Desktop Updater Releases</h2>
        <div id="desktopReleases" class="table-wrap"></div>
      </div>
    </section>
  </main>
  <script src="/assets/app/page-admin-downloads.js?v=20260706"></script>
