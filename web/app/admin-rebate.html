<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rebate Code Admin - Torve</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/assets/site-base.css?v=20260517-mobile" />
  <style>
    body { background: var(--t-bg); color: var(--t-text); font-family: Inter, system-ui, sans-serif; margin: 0; padding: 0; }
    .admin-wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .admin-header h1 { font-size: 22px; font-weight: 800; color: #fff; margin: 0; }
    .admin-back { font-size: 13px; color: var(--t-accent); text-decoration: none; }
    .admin-back:hover { text-decoration: underline; }

    /* Auth gate */
    .auth-gate { max-width: 400px; margin: 80px auto; text-align: center; }
    .auth-gate h2 { font-size: 18px; color: #fff; margin-bottom: 12px; }
    .auth-gate p { font-size: 13px; color: #888; margin-bottom: 20px; }

    /* Cards */
    .admin-card { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .admin-card h2 { font-size: 15px; font-weight: 700; color: #fff; margin: 0 0 14px; }

    /* Forms */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: #aaa; margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 9px 12px; font-size: 13px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; color: #fff; outline: none; box-sizing: border-box; }
    .field input:focus { border-color: var(--t-accent); }
    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1; }

    .btn { display: inline-flex; align-items: center; padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: opacity .2s; }
    .btn-primary { background: linear-gradient(135deg, var(--t-accent), #dbb95c); color: #08080e; }
    .btn-primary:hover { opacity: .9; }
    .btn-secondary { background: rgba(255,255,255,.06); color: #ccc; border: 1px solid rgba(255,255,255,.1); }
    .btn-danger { background: rgba(239,68,68,.12); color: #f87171; border: 1px solid rgba(239,68,68,.2); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }

    /* Table */
    .codes-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .codes-table th { text-align: left; padding: 8px 10px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 10px; }
    .codes-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.04); color: #ccc; vertical-align: top; }
    .codes-table tr:hover td { background: rgba(255,255,255,.02); }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-ok { background: rgba(34,197,94,.12); color: #4ade80; }
    .badge-used { background: rgba(200,164,78,.12); color: var(--t-accent); }
    .badge-revoked { background: rgba(239,68,68,.12); color: #f87171; }
    .badge-muted { background: rgba(255,255,255,.06); color: #888; }

    /* Created codes display */
    .created-codes { background: rgba(34,197,94,.06); border: 1px solid rgba(34,197,94,.15); border-radius: 10px; padding: 16px; margin-top: 16px; }
    .created-codes h3 { font-size: 13px; font-weight: 700; color: #4ade80; margin: 0 0 10px; }
    .code-line { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; color: #fff; padding: 4px 0; display: flex; gap: 8px; align-items: center; }
    .code-line button { font-size: 11px; padding: 2px 8px; }

    .msg { font-size: 13px; margin-top: 10px; }
    .msg-ok { color: #4ade80; }
    .msg-error { color: #f87171; }

    /* Filters */
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filters select, .filters input { padding: 6px 10px; font-size: 12px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; color: #ccc; outline: none; }

    /* Detail modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: #14141a; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 24px; max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .modal-box h3 { font-size: 16px; color: #fff; margin: 0 0 16px; }
    .modal-close { float: right; background: none; border: none; color: #888; font-size: 18px; cursor: pointer; padding: 4px; }
    .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.04); font-size: 13px; }
    .detail-label { color: #888; }
    .detail-value { color: #fff; text-align: right; }

    @media (max-width: 640px) {
      .field-row { flex-direction: column; }
      .codes-table { font-size: 11px; }
      .codes-table th, .codes-table td { padding: 6px; }
    }
  </style>
  <link rel="stylesheet" href="/assets/modern-site.css?v=20261012-7" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body class="modern-page admin-page">
<header class="site-header" data-site-header>
    <div class="site-header-inner">
      <a class="site-brand" href="/" aria-label="Torve home"><img src="/assets/torve-logo-transparent.png" alt="Torve" class="site-header-logo" /></a>
      <nav id="site-navigation" class="site-header-nav" aria-label="Main navigation"><a href="/#explore">Explore</a><a href="/download.html">Downloads</a><a href="/app/help.html">Guide</a><a href="/support.html">Support</a></nav>
      <div class="site-header-actions"><a class="site-account-link t-btn t-btn-secondary" href="/signin.html">Sign in</a><a class="t-btn t-btn-primary" href="/download.html"><span class="install-label-full">Install Torve</span><span class="install-label-short">Install</span><svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg></a></div>
      <button class="site-menu-toggle" type="button" aria-label="Open menu" aria-controls="site-navigation" aria-expanded="false"><span></span><span></span></button>
    </div>
  </header>
  <div class="admin-wrap">
    <div class="admin-header">
      <h1>Rebate Code Admin</h1>
      <div style="display:flex;gap:14px;font-size:13px">
        <a href="/app/admin.html" class="admin-back">&larr; Admin home</a>
        <a href="/app/" class="admin-back">Back to portal</a>
      </div>
    </div>

    <!-- Auth gate -->
    <div id="authGate" class="auth-gate">
      <h2>Admin Access</h2>
      <p>Enter your admin secret to manage rebate codes.</p>
      <div class="field">
        <input type="password" id="secretInput" placeholder="Admin secret" />
      </div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-primary" id="authBtn">Sign in</button>
      </div>
      <div id="authMsg" class="msg" style="text-align:center"></div>
    </div>

    <!-- Admin panel (hidden until auth) -->
    <div id="adminPanel" style="display:none">

      <!-- Create codes -->
      <div class="admin-card">
        <h2>Create Codes</h2>
        <div class="field-row">
          <div class="field">
            <label>Count</label>
            <input type="number" id="createCount" value="1" min="1" max="500" />
          </div>
          <div class="field">
            <label>Campaign</label>
            <input type="text" id="createCampaign" placeholder="e.g. friends-family" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Restrict to email (optional)</label>
            <input type="email" id="createEmail" placeholder="user@example.com" />
          </div>
          <div class="field">
            <label>Restrict to domain (optional)</label>
            <input type="text" id="createDomain" placeholder="example.com" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Grants on redemption</label>
            <select id="createGrantType">
              <option value="lifetime" selected>Lifetime access (default)</option>
              <option value="7">7 days</option>
              <option value="30">30 days (1 month)</option>
              <option value="90">90 days (3 months)</option>
              <option value="365">365 days (1 year)</option>
              <option value="custom">Custom number of days…</option>
            </select>
          </div>
          <div class="field" id="customDaysWrap" style="display:none">
            <label>Days (1–3650)</label>
            <input type="number" id="createGrantDays" min="1" max="3650" placeholder="e.g. 14" />
          </div>
        </div>
        <div class="field">
          <label>Internal note (optional)</label>
          <input type="text" id="createNote" placeholder="Who is this for?" />
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="createBtn">Create codes</button>
        </div>
        <div id="createMsg" class="msg"></div>
        <div id="createdCodes" style="display:none"></div>
      </div>

      <!-- Code list -->
      <div class="admin-card">
        <h2>All Codes</h2>
        <div class="filters">
          <select id="filterStatus">
            <option value="">All statuses</option>
            <option value="unredeemed">Unredeemed</option>
            <option value="redeemed">Redeemed</option>
            <option value="revoked">Revoked</option>
          </select>
          <input type="text" id="filterCampaign" placeholder="Filter by campaign" />
          <button class="btn btn-secondary btn-sm" id="refreshBtn">Refresh</button>
        </div>
        <div id="codeList">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div id="detailModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="/assets/app/page-admin-rebate.js"></script>
  <script src="/assets/modern-site.js?v=20261012-7" defer></script>
</body>
</html>
