# Public release routes installed inside the torve.app HTTPS server block.
# Keep these routes narrow: the fallback `/downloads/` location returns 404.

location = /help.html {
    return 301 /app/help.html;
}

location = /downloads/releases.json {
    alias /opt/torve/downloads/releases.json;
    types {
        application/json json;
    }
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=60";

    limit_except GET HEAD {
        deny all;
    }
}

location ~ ^/downloads/provenance/(?<provenance_file>torve-[0-9]+\.[0-9]+\.[0-9]+\.json)$ {
    alias /opt/torve/downloads/provenance/$provenance_file;
    types {
        application/json json;
    }
    default_type application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";

    limit_except GET HEAD {
        deny all;
    }
}

location ~ ^/downloads/(?<download_file>(windows|android)/[^/]+\.(msi|apk|sha256))$ {
    alias /opt/torve/downloads/$download_file;
    autoindex off;
    types {
        application/octet-stream msi;
        application/vnd.android.package-archive apk;
        text/plain sha256;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";

    limit_except GET HEAD {
        deny all;
    }
}

location /downloads/ {
    autoindex off;

    limit_except GET HEAD {
        deny all;
    }

    return 404;
}
