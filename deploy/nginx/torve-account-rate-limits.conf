# Include in nginx's http context. Account restore performs several authenticated
# reads on startup; these must not consume the quota for account mutations.
map $request_method $torve_account_read_key {
    default "";
    GET $binary_remote_addr;
    HEAD $binary_remote_addr;
}
map $request_method $torve_account_write_key {
    default $binary_remote_addr;
    GET "";
    HEAD "";
}
limit_req_zone $torve_account_read_key zone=torve_account_read:10m rate=10r/s;
limit_req_zone $torve_account_write_key zone=torve_account_write:10m rate=30r/m;

# In the existing /me/(integrations|playlists|devices|pairings|account) location:
# limit_req zone=torve_account_read burst=40 nodelay;
# limit_req zone=torve_account_write burst=10 nodelay;
# limit_req_status 429;
