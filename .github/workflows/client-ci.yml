name: Client quality gates

on:
  pull_request:
  push:
    branches: [main, master, codex-publish-local-updates]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source version alignment
        shell: powershell
        run: ./tools/check-release-version-alignment.ps1 -SourceOnly
      - name: Verify release source provenance
        shell: powershell
        run: ./tools/check-release-provenance.ps1 -RequireTag
      - name: Verify public positioning copy
        shell: powershell
        run: ./tools/check-public-positioning.ps1
      - name: Verify public website and recovery paths
        shell: powershell
        run: ./tools/check-public-website.ps1
      - name: Validate public website JavaScript syntax
        shell: powershell
        run: |
          node --check web/assets/app/setup.js
          node --check web/assets/app/page-setup.js
          Get-ChildItem web/assets/app/lang/*.js | ForEach-Object { node --check $_.FullName }
      - name: Run shared, desktop, TV, and mobile tests
        shell: powershell
        run: >-
          ./gradlew.bat
          :shared:allTests
          :desktopApp:test
          :androidApp:testAmazonTvDebugUnitTest
          :androidApp:testGoogleTvDebugUnitTest
          :androidApp:testGoogleMobileDebugUnitTest
          --console=plain
      - name: Compile every Android release surface
        shell: powershell
        run: >-
          ./gradlew.bat
          :androidApp:compileAmazonTvReleaseKotlin
          :androidApp:compileGoogleTvReleaseKotlin
          :androidApp:compileGoogleMobileReleaseKotlin
          :androidApp:lintGoogleMobileRelease
          --console=plain
      - name: Build and validate Android delivery artifacts
        shell: powershell
        run: |
          $ciKeystore = Join-Path $env:RUNNER_TEMP "torve-ci-release.jks"
          keytool -genkeypair -noprompt -keystore $ciKeystore -storepass "ci-release-only" -keypass "ci-release-only" -alias "ci-release" -dname "CN=Torve CI, O=Torve CI, C=DE" -keyalg RSA -keysize 2048 -validity 2
          $env:TORVE_KEYSTORE_PATH = $ciKeystore
          $env:TORVE_KEYSTORE_PASSWORD = "ci-release-only"
          $env:TORVE_KEY_ALIAS = "ci-release"
          $env:TORVE_KEY_PASSWORD = "ci-release-only"
          ./gradlew.bat :androidApp:assembleAmazonTvRelease :androidApp:bundleGoogleTvRelease :androidApp:bundleGoogleMobileRelease --console=plain
          ./tools/check-android-16kb-compatibility.ps1
      - name: Reject whitespace and conflict-marker damage
        shell: powershell
        run: git diff --check HEAD
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn
